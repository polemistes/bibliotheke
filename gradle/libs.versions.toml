[versions]
agp = "9.1.1"
kotlin = "2.4.10"
ksp = "2.3.13"
hilt = "2.60.1"
androidx-hilt = "1.3.0"
compose-bom = "2026.08.00"
activity = "1.12.4"
appcompat = "1.7.1"
core = "1.17.0"
lifecycle = "2.10.0"
navigation = "2.10.1"
datastore = "1.2.1"
work = "2.11.2"
sqlite = "2.6.2"
okhttp = "5.4.0"
serialization = "1.11.0"
coroutines = "1.10.2"
coil = "3.6.2"
junit = "4.13.2"
jsoup = "1.23.2"
room = "2.8.5"
webkit = "1.18.0"

[libraries]
androidx-core = { module = "androidx.core:core-ktx", version.ref = "core" }
