# SPDX-License-Identifier: GPL-3.0-or-later
wiki: de
domain: de.wikisource.org
dbname: dewikisource
language: de
namespaces: {index: 104, page: 102}   # no Author namespace on de (F§1)
header_templates: [Textdaten, Navigation2, GartenlaubenArtikel, Gesetzestext, Zeitschrift]
positional_headers:
  Navigation: {container: 1, prev: 2, next: 3, relative: true}
header_params:
  author: [autor]
  # publication year, else the year of writing; laws ({{Gesetzestext}}) carry dates
  year: [erscheinungsjahr, entstehungsjahr, jahr, diesefassung, bekanntmachung, ursprungsfassung]
  translator: [übersetzer]
  description: [kurzbeschreibung]
  image: [bild]
structure:
  container_params: [herkunft, artikel]    # first wikilink inside HERKUNFT (WS§3.3)
  prev_next_params: [[voriger, nächster]]
  current_params: [titel]
  index_params: [indexseite]
  plain_title_params: [voriger, nächster]  # VORIGER/NÄCHSTER are plain titles
  toc_marker: [herkunft, "off"]
  toc_fields: [inhaltsverzeichnis]
  # templates that transclude Seite:{{{2}}} (checked 2026-10-31; SeitePR1 and Seite only mark a page)
  page_templates: {SeitePR: 2, SeiteST: 2, "SeitePR Rand": 2, PoemPR: 2, SeiteLST: 2}
  chapter_label_regex: '^((\d+|[ivxlc]+)\.?\s+|(erste[rs]?|zweite[rs]?|dritte[rs]?|vierte[rs]?|fünfte[rs]?|sechste[rs]?|siebente[rs]?|siebte[rs]?|achte[rs]?|neunte[rs]?|zehnte[rs]?|elfte[rs]?|zwölfte[rs]?|letzte[rs]?)\s+)?(kapitel|buch|heft|stück|teil|theil|abschnitt|aufzug|gesang|lieferung|jahrgang|band|brief|akt)\b|^(vorrede|vorwort|einleitung|anhang|nachwort|inhalt|register)\b'
  # Page-by-page books ("Allgemeines Deutsches Kommersbuch:47") and the
  # Topographia volumes: headerless colon pages listed by their root page
  # (decided 2026-11-01, item 4).
  headerless_toc_members: true
# Lexicon pseudo-namespaces (F§1, WS§1); the survey lists every colon prefix with >= 100 root pages.
# Hantzsch: (Namenbuch der Straßen und Plätze Dresdens, 390 entries) added 2026-11-01.
exclude_title_prefixes: ["RE:", "MKL1888:", "ADB:", "BLKÖ:", "Zedler:", "Boetticher:", "Haan:", "Hantzsch:"]
disambiguation_templates: [Begriffsklärung, BKS]
versions_templates: []
author_page_templates: [Personendaten]
# Portals in ns0 (step 1): topic, place, list and book-series pages
exclude_templates: [Themendaten, Ortsdaten, Listendaten]
exclude_categories: [Thema, Orte, Listen]
exclude_headerless_roots: true     # root pages without header, scans or status (see structure.py)
other_versions_templates: [Andere Version]
quality:
  show_unknown_by_default: false     # owner decision 2026-11-01 (item 1): every de text declares a status
  bibliography_templates: [Zeitschrift]   # periodical bibliography pages without content (item 1)
  status_params: [bearbeitungsstand, status]
  status_values: {fertig: validated, korrigiert: proofread, unkorrigiert: unproofread,
                  teilkorrigiert: unproofread, unvollständig: incomplete}
  textquality_templates: []
  index_type_fields: []
  index_progress_fields: []
  incomplete_templates: []
metadata:
  sort_articles: [der, die, das, ein, eine]
  anonymous_names: [Unbekannt, unbekannt, Anonym, Anonymus, N. N., Verschiedene]
  header_placeholders: ["off", "-", "–", "—", "?", "o. j.", "o. a.", "unbekannt"]
  year_categories: [['^(\d{3}0)er Jahre$', 8], ['^(\d{1,2})\. Jahrhundert$', 7]]
  document_templates: [Gesetzestext]
  document_category_patterns: ['^(Rechtsnorm|Gerichtsentscheidung|Vertrag|Anordnung|Rechtstext|Kulturabkommen)$']
  genre_categories:
    Gedicht: poetry
    Versdichtung: poetry
    Sonett: poetry
    Ballade: poetry
    Sagenballade: poetry
    Mundartgedicht: poetry
    Lied: song-hymn
    Kirchenlied: song-hymn
    Tafellied: song-hymn
    Roman: novel
    Erzählung: short-story
    Novelle: short-story
    Drama: drama
    Essay: essay
    Rezension: essay
    Glosse: essay
    Musikkritik: essay
    Brief: letters
    Biographie: memoir-biography
    Autobiographie: memoir-biography
    Tagebuch von Hans Brass: memoir-biography
    Geschichte: history
    Politische Geschichte: history
    Regionalgeschichte: history
    Rechtsgeschichte: history
    Wirtschaftsgeschichte: history
    Sozialgeschichte: history
    Sage: folklore
    Märchen: folklore
    Volkskunde: folklore
    Predigt: religious
    Religionswissenschaft / Theologie: religious
    Rede: speech
    Vortrag: speech
    Reisebericht: travel
    Philosophie: philosophy
    Physik: science
    Mathematik: science
    Astronomie: science
    Zoologie: science
    Biologie: science
    Medizin: science
    Paläontologie: science
    Spezielle Relativitätstheorie: science
    Lexikonartikel: reference
    Lexikon: reference
    Zeitschriftenartikel: periodical
    Zeitungsartikel: periodical
    Rechtsnorm: legal-government
    Gerichtsentscheidung: legal-government
    Vertrag: legal-government
    Anordnung: legal-government
    Rechtstext: legal-government
    Kulturabkommen: legal-government
