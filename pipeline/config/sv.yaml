# SPDX-License-Identifier: GPL-3.0-or-later
wiki: sv
domain: sv.wikisource.org
dbname: svwikisource
language: sv
namespaces: {author: 106, index: 108, page: 104}   # verified in WP0, F§1
header_templates: [Titel]            # {{Titel|[[Container]]|Author|förra=|nästa=|kommentar=}}
header_params:
  author: [författare, "2"]
  year: [år]
  translator: [översättare]
index_fields:
  author: [upphovsman]
  translator: [översättare, oversattare]
  year: [år]
  image: [bild]
structure:
  container_params: ["1"]
  prev_next_params: [[förra, nästa], [prev, next]]
  current_params: [current]
  toc_fields: [kommentar, anmärkningar]
  chapter_label_regex: '^((\d+|[ivxlc]+)\.?\s+|(första|andra|tredje|fjärde|femte|sjätte|sjunde|åttonde|nionde|tionde|sista)\s+)?(kapitel|kapitlet|akt|akten|del|delen|bok|boken|band|brev|sång|sången|scen)\b|^(förord|inledning|företal|efterskrift|innehåll)\b'
  # {{Titel}}'s first parameter is the page's own title, so collections of
  # root pages (Fänrik Ståls sägner, Frithiofs saga, Gluntarne) hang on their
  # TOC-only root and the prev/next chain (decided 2026-11-01, WP1 item 5)
  textless_toc_roots: true
disambiguation_templates: [Förgreningssida, Förgrening]
versions_templates: []
quality:
  show_unknown_by_default: true      # owner decision 2026-11-01 (WP1 item 3): hymns and poems by Wallin, Runeberg, Tegnér, Bellman; 2 stubs in a sample of 30
  index_type_fields: []
  index_progress_fields: []          # sv Indexes have no progress field (3.4)
metadata:
  sort_articles: [en, ett]
  anonymous_names: [Anonym, Okänd, Okänd författare]
  year_categories: [['^(\d{2}[1-9]0)-talets verk$', 8]]   # "1860-talets verk"; "1700-talet" is a century, left out
  genre_category_patterns:
    - ['^Sångtexter$|^Psalmer$|^Barnvisor$|^Skillingtryck$|^Visor', song-hymn]
    - ['^Poesi$|^Diktsamlingar$|^Dikter', poetry]
    - ['^Romaner$', novel]
    - ['^Noveller$', short-story]
    - ['^Sagor$|^Sägner$', folklore]
    - ['^Historiska dokument$|historia$', history]
    - ['^Biografier$', memoir-biography]
    - ['^Reseskildringar$', travel]
    - ['^Tidningsartiklar$', periodical]
