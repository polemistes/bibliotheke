# SPDX-License-Identifier: GPL-3.0-or-later
wiki: fr
domain: fr.wikisource.org
dbname: frwikisource
language: fr
namespaces: {author: 102, index: 112, page: 104}   # verified in WP0, F§1
header_templates: [header]          # fr structure comes from <pages header=1> and the Index fields
header_params:
  author: [auteur, author]
  year: [annee, année, year]
  translator: [traducteur, translator]
index_fields:
  author: [auteur]
  translator: [traducteur]
  year: [annee]
  image: [image]
  language: [langue]
  qid: [wikidata_item]
structure:
  container_params: [titre, title]
  prev_next_params: [[prev, next], [précédent, suivant]]
  current_params: [current]
  toc_fields: [sommaire]
  chapter_label_regex: '^((\d+|[ivxlc]+)\.?\s+|(premier|première|second|seconde|deuxième|troisième|quatrième|cinquième|sixième|septième|huitième|neuvième|dixième|dernier|dernière)\s+)?(chapitre|livre|partie|acte|scène|chant|tome|volume|lettre|section|fable|proposition|théorème|lemme|problème|séance)\b|^(préface|avant-propos|introduction|conclusion|épilogue|prologue|appendice|notes?|table des matières|table)\b'
  whole_text_subpages: [Texte entier, Texte complet]
disambiguation_templates: [homonymie, disambiguation]
# dictionary roots carry the disambiguation prop through {{Dct}}; they are works
not_disambiguation_templates: [Dct, IndexAlpha]
versions_templates: [éditions, traductions]
other_versions_templates: [voir éditions, AutreVersion]
content:
  line_number_selectors: ['span.OptionText[title="Vers numérotés"]']   # {{NumVers}}, F§2.7
quality:
  show_unknown_by_default: false     # owner decision 2026-11-01 (item 1): 120 works, a third of them empty shells
  textquality_values: {"textes validés": validated}
  index_progress_fields: [avancement]
  index_progress_values: {D: null}  # D: duplicate file, not a progress state
  incomplete_templates: [incomplet]
metadata:                            # 5.2 step 3
  sort_articles: [le, la, les, "l'", "l’", un, une, des, du]
  anonymous_names: [Anonyme, Anonymes, Inconnu, Auteur inconnu]
  year_categories: [['^(?:Articles de |Publiés en )?(\d{4})$', 9], ['^([XVI]+)e siècle$', 7]]
  document_templates: [DP-ONU, DP-EU]
  genre_category_patterns:
    - ['^Romans', novel]
    - ['^Nouvelles|^Recueils de nouvelles|^Contes$|^Recueils de contes', short-story]
    - ['^Recueils de poèmes|^Poèmes|^Poésie|^Sonnets$|^Odes$|^Ballades$', poetry]
    - ['^Théâtre|^Comédies$|^Tragédies$|^Drames$|^Livrets$', drama]
    - ['^Essais', essay]
    - ['^Lettres$|^Correspondance', letters]
    - ['^Biographies$|^Mémoires$|^Autobiographies$', memoir-biography]
    - ['^Histoire|^Révolution française$', history]
    - ['^Fables|^Légendes$|^Contes populaires|^Folklore', folklore]
    - ['^Chansons|^Goguette$|^Cantiques', song-hymn]
    - ['^Discours$', speech]
    - ['^Christianisme$|^Sermons$|^Théologie', religious]
    - ['^Philosophie|^Histoire de la philosophie$', philosophy]
    - ['^Voyage|^Récits de voyage', travel]
    - ['^Littérature jeunesse$', children]
    - ['^Physique$|^Médecine|^Mathématiques$|^Astronomie$|^Chimie$|^Sciences', science]
    - ['^Articles de la Revue|^Articles de périodique|^Séries d’articles|^Articles parus dans|^Chroniques', periodical]
    - ['^Dictionnaires|^Encyclopédies', reference]
