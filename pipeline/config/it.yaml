# SPDX-License-Identifier: GPL-3.0-or-later
wiki: it
domain: it.wikisource.org
dbname: itwikisource
language: it
namespaces: {author: 102, index: 110, page: 108}   # verified in WP0, F§1
header_templates: [Intestazione]
positional_headers:
  Raccolta: {container: 1}           # {{Raccolta|Collection}}: the text belongs to that collection
header_params:
  author: [nome e cognome dell'autore]
  year: [anno di pubblicazione]
  translator: [nome e cognome del traduttore]
  genre: [argomento]                 # topic: "sonetti", "Romanzi", "diritto", read like a category
index_fields:
  author: [autore]
  translator: [traduttore]
  year: [anno]
  image: [immagine]
  language: [lingua]
structure:
  container_params: [titolo]
  prev_next_params: [[prec, succ]]
  current_params: [sezione]
  toc_fields: [sommario]
  chapter_label_regex: '^((\d+|[ivxlc]+)\.?\s+|(primo|prima|secondo|seconda|terzo|terza|quarto|quarta|quinto|quinta|sesto|sesta|settimo|settima|ottavo|ottava|nono|nona|decimo|decima|ultimo|ultima)\s+)?(capitolo|canto|atto|scena|libro|parte|lettera|tomo|volume|sezione)\b|^(prefazione|introduzione|indice|proemio|avvertenza|appendice)\b'
disambiguation_templates: [Disambigua]
versions_templates: []
other_versions_templates: [AltraVersione]
content:
  drop_selectors: [div.quality-ns0]  # {{Qualità}}: "Questo testo è riletto e controllato." (WP3)
quality:
  show_unknown_by_default: false     # owner decision 2026-11-01 (WP1 item 3): moot, every it work has a tier
  textquality_templates: [Qualità]
  textquality_params: [avz]          # SAL 25/50/75/100 % (PLAN.md 3.4)
  index_type_fields: []
  index_progress_fields: [qualità]   # free text on it (3.4): only the SAL percentages are read
  index_progress_values: {"100%": validated, "75%": proofread, "50%": unproofread, "25%": unproofread,
                          T: null, V: null, C: null, MS: null, OCR: null, L: null, X: null}
metadata:
  sort_articles: [il, lo, la, i, gli, le, "l'", un, uno, una, "un'"]
  anonymous_names: [Anonimo, Anonimi, Autore anonimo, Autori vari]
  document_templates: [Diritto legge, Diritto convenzione, Normattiva]
  year_categories: [['^Norme (\d{4})$', 9]]
  document_category_patterns: ['^(Decreti|Decreti legge|Decreti legislativi|Leggi|Leggi costituzionali|Codici|Proclami|Sentenze della Corte Costituzionale|Convenzioni Trattati e Protocolli)$|^Norme \d{4}$|^Diritto-']
  genre_category_patterns:
    - ['^Canti', song-hymn]
    - ['^Poesie|^Raccolte di poesie$|^Sonetti$|^Poemi|^Anacreontiche$|^Canzoni$|^Odi$|^Epigrammi$|^Madrigali$|^Epitaffi$|^corone di sonetti$', poetry]
    - ['^Romanzi$', novel]
    - ['^Novelle$|^Racconti$', short-story]
    - ['^Filosofia$', philosophy]
    - ['^Diari di viaggio$|^Viaggi$', travel]
    - ['^Fiabe$|^Favole$|^Leggende$', folklore]
    - ['^Cristianesimo$', religious]
    - ["^Commedia dell'Arte$|^Commedie$|^Tragedie$|^Libretti d'opera$", drama]
    - ['^Saggi$', essay]
    - ['^Lettere$', letters]
    - ['^Biografie$|^Necrologi$|^Autobiografie$', memoir-biography]
    - ['^Storia|^Documenti (storici|di storia)|^Risorgimento$', history]
    - ['^Preghiere|^Testi sacri|^Encicliche$', religious]
    - ['^Discorsi', speech]
    - ['^Letteratura per ragazzi$', children]
    - ['^Articoli', periodical]
    - ['^Decreti|^Leggi|^Diritto|^Norme|^Convenzioni|^Codici$|^Proclami$|^Sentenze', legal-government]
