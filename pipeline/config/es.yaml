# SPDX-License-Identifier: GPL-3.0-or-later
wiki: es
domain: es.wikisource.org
dbname: eswikisource
language: es
namespaces: {author: 106, index: 104, page: 102}   # verified in WP0, F§1
header_templates: [Encabezado]
header_params:
  author: [autor]
  year: [año]
  translator: [traductor]
index_fields:
  author: [autor]
  translator: [traductor]
  year: [ano, año]
  image: [imagen]
  qid: [wikidata]
structure:
  container_params: [título, titulo]
  prev_next_params: [[anterior, próximo], [anterior, siguiente]]
  current_params: [sección]
  toc_fields: [notas]
  summary_templates: [Índice auxiliar]
  chapter_label_regex: '^((\d+|[ivxlc]+)\.?\s+|(primer|primero|primera|segundo|segunda|tercer|tercero|tercera|cuarto|cuarta|quinto|quinta|sexto|sexta|séptimo|séptima|octavo|octava|noveno|novena|décimo|décima|último|última)\s+)?(capítulo|libro|parte|acto|escena|canto|tomo|volumen|carta|tratado|sección|jornada)\b|^(prólogo|prefacio|introducción|índice|epílogo|apéndice|dedicatoria)\b'
exclude_title_prefixes: ["Proyecto:"]   # project pages in ns0 (PLAN.md 5.2 step 1; six pages, WP1 item 5)
disambiguation_templates: [Desambiguación]
versions_templates: [Ediciones]
quality:
  show_unknown_by_default: true      # owner decision 2026-11-01 (WP1 item 3): Calderón, Altamirano, Pereda, Manrique, decrees; dictionary entries are typed reference
  index_type_fields: []
  index_progress_fields: [progreso]
  # docs/wp0/index-progress.json: T done, V to validate, C to proofread, P
  # to proofread without pagelist, L damaged, E extract
  index_progress_values: {T: validated, V: proofread, C: unproofread, P: unproofread, L: faulty,
                          E: incomplete, MS: null, OCR: null, X: null}
metadata:
  sort_articles: [el, la, los, las, lo, un, una, unos, unas]
  anonymous_names: [Anónimo, Anonimo, Desconocido]
  document_templates: [Documento ONU, DP-ONU, DP-USGOV]
  year_categories: [['^P(\d{4})$', 9], ['^Siglo ([XVI]+)$', 7]]
  document_category_patterns: ['^(Leyes|Decretos) de |^Leyes económicas|^Tratados internacionales$|^Actas del Cabildo']
  genre_category_patterns:
    - ['^Poesías|^Sonetos$|^Romances|^Romancero', poetry]
    - ['^Cuentos', short-story]
    - ['^Novelas', novel]
    - ['^Teatro', drama]
    - ['^Ensayos', essay]
    - ['^Epístolas$|^Cartas$', letters]
    - ['^Biografías$', memoir-biography]
    - ['^Fábulas', folklore]
    - ['^Canciones$|^Himnos', song-hymn]
    - ['^Discursos', speech]
    - ['^Historia|^Independencia de', history]
    - ['^Artículos', periodical]
    - ['^Leyes|^Decretos|^Tratados', legal-government]
    - ['^Diccionario|^Sinónimos', reference]
