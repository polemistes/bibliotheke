# SPDX-License-Identifier: GPL-3.0-or-later
# wikisource.org, the multilingual Wikisource (PLAN.md 3.1): texts in
# languages without a wiki of their own, each with its own header template.
wiki: mul
domain: wikisource.org
dbname: sourceswiki
language: mul
upload_dir: sources
namespaces: {author: 108, index: 106, page: 104}   # verified in WP0, F§1
header_templates: [Header, Отексте, Текст турында, Dane tekstu, Textdaten, Текст сярысь]
header_params:
  author: [author, override_author, автор, автор1, autor, schriever, originalschriever]
  year: [year, датапубликации, датасоздания, нәшер итү датасы, rok wydania, rok powstania, rutkamen_johr, schreven_johr, ар]
  translator: [translator, переводчик, тәрҗемәче, tłumacz, берыктӥсь]
structure:
  container_params: [title]
  prev_next_params: [[previous, next], [предыдущий, следующий], [poprzedni, następny]]
  current_params: [section, часть]
  toc_fields: [remarks]
disambiguation_templates: [disambiguation, Disambig]
versions_templates: [versions]
quality:
  show_unknown_by_default: true      # owner decision 2026-11-01 (WP1 item 3): poems in Kurdish, Punjabi, Mingrelian, Uzbek, Ladin; 774 works without
metadata:
  anonymous_names: [Anonymous, Unknown]
  # each text's language (the wiki's own language is `mul`)
  language_categories: {Mingrelian: xmf, Башҡортса: ba, Volapük: vo, Volapük rigik: vo, Volapük perevidöl: vo,
                        Tatar: tt, Ladin: lld, Lumbaart: lmo, Polski: pl, Tibetan: bo, Udmurt: udm,
                        Zazaki: zza, Upper Sorbian: hsb, Hill Mari: mrj, Furlan: fur, Gagauz: gag,
                        ʻŌlelo Hawaiʻi: haw, Kurdî: ku, Occitan: oc, Тыва дыл: tyv, Plattdüütsch: nds,
                        සිංහල: si, Kazakh: kk, Pali: pi, Literary Chinese: lzh, Aromanian (rup): rup,
                        "Sq Shqip (Albanian)": sq, ລາວ: lo}
  genre_category_patterns:
    - ['^Шиғыр$|^Кылбуръёс$', poetry]
    - ['^Балалар өсөн әҫәрҙәр$', children]
    - ['^Хикәйә$', short-story]
    - ['^Әкиәт$', folklore]
    - ['^National Anthems$', song-hymn]
