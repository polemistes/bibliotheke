# SPDX-License-Identifier: GPL-3.0-or-later
wiki: no
domain: no.wikisource.org
dbname: nowikisource
language: nb
namespaces: {author: 102, index: 106, page: 104}   # verified in WP0, F§1
header_templates: [topp, topp2, header]
header_params:
  author: [forfatter, author]
  year: [år, year]
structure:
  container_params: [tittel, title]
  prev_next_params: [[forrige, neste], [prev, next], [previous, next]]
  current_params: [seksjon, current, section]
  toc_fields: [sammendrag]
  summary_templates: [Innholdsfortegnelse]
  chapter_label_regex: '^((\d+|[ivxlc]+)\.?\s+|(første|forste|anden|andet|annen|annet|tredje|tredie|fjerde|fjærde|fierde|femte|sjette|siette|syvende|sjuende|ottende|åttende|niende|tiende|ellevte|tolvte|trettende|fjortende|femtende|sekstende|syttende|attende|nittende|tyvende|siste|sidste)\s+)?([kc]apit+el|akt|del|bind|brev|bok|bog|sang|hefte)\b|^(forord|innledning|indledning|tillæg|tillegg|efterskrift|etterord|fortale)\b'
disambiguation_templates: [Peker, Flertydig, disambiguation]
versions_templates: []
quality:
  show_unknown_by_default: true      # owner decision, WS§10.8 item 2
  index_progress_fields: [fremgang]
  # Fremgang is free text on no (F§5): OCR is on 546 Indexes whose works are
  # often proofread, so only T/V/C are read as progress codes.
  index_progress_values: {MS: null, OCR: null, L: null, X: null}
  incomplete_templates: [ufullstendig]
  junk_templates: [opprydning, slett, sletting]
  placeholders: ["Ennå ikke fri"]
  own_translation: {params: [oversetter], values: [Wikikilden]}
