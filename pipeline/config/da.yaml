# SPDX-License-Identifier: GPL-3.0-or-later
wiki: da
domain: da.wikisource.org
dbname: dawikisource
language: da
namespaces: {author: 102, index: 106, page: 104}   # verified in WP0, F§1
header_templates: [Header, Sang Infomation]
header_params:
  author: [forfatter, override_forfatter, author, override_author]
  year: [år, year]
  translator: [oversætter, translator]
index_fields:
  author: [forfatter]
  translator: [oversætter]
  year: [år]
  image: [billede]
structure:
  container_params: [titel, title]
  prev_next_params: [[forrige, næste], [previous, next]]
  current_params: [afsnit, section]
  toc_fields: [bemærkninger]
  chapter_label_regex: '^((\d+|[ivxlc]+)\.?\s+|(første|anden|andet|tredje|fjerde|femte|sjette|syvende|ottende|niende|tiende|sidste)\s+)?([kc]apitel|akt|del|bind|bog|brev|sang|afsnit|optrin)\b|^(forord|indledning|fortale|efterskrift|indhold)\b'
disambiguation_templates: [Flertydig, Disambig]
versions_templates: [Udgaver]
other_versions_templates: [Udgave]
quality:
  show_unknown_by_default: true      # owner decision 2026-11-01 (WP1 item 3): hymns by Grundtvig and Ingemann, Andersen; 112 works without
  index_type_fields: []
  index_progress_fields: [status]
  index_progress_values: {F: validated, V: proofread, K: unproofread}   # F§5 / docs/wp0/index-progress.json
metadata:
  sort_articles: [en, et, den, det, de]
  anonymous_names: [Anonym, Ukendt, Ukendt forfatter]
  document_templates: [PD-DenmarkGov]
  year_categories: [['^(\d{4})$', 9]]
  document_category_patterns: ['^(Lovtekst|Domme og Retssager|Danmarks Riges Grundlov|Kancelliets brevbøger)$']
  genre_category_patterns:
    - ['^Salmer$|sange$|^Viser$|^Folkeviser$', song-hymn]
    - ['^Poesi$|^Hyldestdigte$|^Digte', poetry]
    - ['^Romaner$', novel]
    - ['^Noveller$|^Novellesamlinger$|^Fortællinger$', short-story]
    - ['^Eventyr$|^Sagn$', folklore]
    - ['^Historiske dokumenter$|^Danmarkshistorie$', history]
    - ['^Kristendom$', religious]
    - ['^Filosofi$|^Om politik og filosofi$', philosophy]
    - ['^Tidsskrifter$', periodical]
    - ['^Lovtekst$|^Domme og Retssager$|^Danmarks Riges Grundlov$', legal-government]
