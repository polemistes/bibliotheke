# Defaults for every wiki (PLAN.md 5.5); pipeline/config/{wiki}.yaml overrides
# them key by key. Template names are case-insensitive in the first letter;
# parameter and Index field names are case-insensitive.
wiki: null
namespaces: {}
header_templates: [header]           # templates whose named parameters carry structure
positional_headers: {}               # name -> {container: n, prev: n, next: n, relative: bool}
header_params:                       # metadata parameters (5.2 step 3)
  author: [author]
  year: [year]
  translator: [translator]
  description: []
  image: []
index_fields:                        # Index page fields used as metadata (5.2 step 3)
  author: [author]
  translator: [translator]
  year: [year]
  image: [image]                     # cover: a file name or a page number of the scan
  language: [language]
  qid: []                            # the scanned edition's Wikidata item (fr)
structure:                           # WS§5.3; resolution rules in PLAN.md 5.2 steps 1a-1h
  container_params: [title]          # header template, <pages header=1> attribute or Index field
  prev_next_params: [[prev, next], [previous, next]]
  current_params: [current, section]
  index_params: [index]
  plain_title_params: []             # parameters whose value is a plain title, not a link (de)
  toc_marker: null                   # [param, value] marking a TOC page (de: [HERKUNFT, off])
  toc_fields: [toc, contents]        # Index fields holding the TOC
  toc_sources: [ws-summary, summary, body-links]
  summary_templates: []              # templates wrapping the TOC (emit .ws-summary)
  page_templates: {}                 # templates transcluding a Page: page -> positional param
  # A display title matching this is a chapter label, not a searchable text
  # (WS§4 step 4): a label word, optionally after a number or an ordinal
  # ("Chapter 1", "First Book", "Første kapitel"), a bare number or roman
  # numeral, or leading numbering ("21. Begivenheder …"); tuned from the
  # WP1a samples (decision 8.9). Ordinals are listed, so that a name before
  # the word ("Paulus's Brev til Titus") does not count.
  chapter_label_regex_default: '^((\d+|[ivxlc]+)\.?\s+|(first|second|third|fourth|fifth|sixth|seventh|eighth|ninth|tenth|last)\s+)?(chapter|kapitel|kapittel|capitel|chapitre|capitolo|acte?|akt|letter|brief|part|partie|book|band|bind|tome|volume|livre|canto|scene|scène|szene)\b|^[ivxlcdm]+\.?$|^\d+\.?$|^(\d+|[ivxlcdm]+)[.)]\s'
  chapter_label_regex: null          # per-wiki additions, tuned from the survey
  oversized_bytes: 300000
  parts_cap: 2000                    # confirmed 2026-11-01 (decision 8.4; STATUS.md item 2)
  # A work over reference_threshold parts with no Index type is `reference`
  # only when its root's children have no reading-order signal (order
  # natural or toc-partial); a chain or TOC order marks a periodical or
  # collection (decided 2026-11-01, item 3).
  reference_threshold: 2000
  whole_text_subpages: []
  # Rule 3 extension (decided 2026-11-01, item 4; de only): a page with no
  # header template and no status that is listed by exactly one TOC-like
  # page is its member regardless of Index or chain, and a root page with a
  # header and an Index that lists >= 3 such pages counts as TOC-like
  # (de page-by-page books and Merian's Topographia volumes).
  headerless_toc_members: false
metadata:                            # metadata merge (5.2 step 3)
  sort_articles: []                  # leading articles ignored in sort_title
  anonymous_names: []                # author values that name nobody
  author_link_templates: []          # templates whose first parameter is an author's name
  author_categories: false           # a category named like an author page names the author
  language_map: {}                   # Index language field value -> BCP47
  year_category_regex: null          # category -> year (group 1)
  document_templates: []             # licence or case templates of government documents
  document_template_patterns: []
  document_category_patterns: []
  genre_templates: {}                # template -> genre key
  genre_categories: {}               # category (without namespace) -> genre key
  genre_category_patterns: []        # [regex, genre key]
  # type of a single-page work from its genre (Merger.work_type)
  genre_types: {poetry: poem, song-hymn: poem, drama: play, essay: article,
                legal-government: document, speech: document}
exclude_title_prefixes: []
disambiguation_templates: [disambiguation]
versions_templates: [versions]
author_page_templates: []
exclude_templates: []
exclude_categories: []
other_versions_templates: [other versions]   # pattern I on text pages
quality:                             # WS§10, PLAN.md 5.4
  show_unknown_by_default: null      # set by the owner from the WP1a survey
  status_params: []
  status_values: {}
  textquality_templates: [TextQuality]
  textquality_values: {"100%": validated, "100": validated, "75%": proofread, "75": proofread,
                       "50%": unproofread, "50": unproofread, "25%": unproofread, "25": unproofread,
                       "00%": unproofread, "0%": unproofread}
  index_type_fields: [type]
  index_types: {book: book, collection: collection, journal: periodical-issue,
                dictionary: reference, phdthesis: document}
  index_progress_fields: [progress]
  index_progress_values: {T: validated, V: proofread, C: unproofread,
                          MS: faulty, OCR: faulty, L: faulty, X: incomplete}
  incomplete_templates: [incomplete]
  junk_templates: []
  placeholders: []
  # A single-page root whose only header template is one of these, with no
  # scans and no status, is a bibliography page, not a text (de
  # {{Zeitschrift}}; decided 2026-11-01, item 1): hard-excluded as `bibliography`.
  bibliography_templates: []
  # Coverage (item 7): of the Index's text pages that no other work
  # transcludes, the work must cover coverage_min; up to coverage_slack
  # untranscluded pages (title pages) are tolerated.
  coverage_min: 0.95
  coverage_slack: 3
  own_translation: {params: [], values: []}
