       ninth: 9, tenth: 10, eleventh: 11, twelfth: 12}
  fr: {premier: 1, première: 1, deuxième: 2, second: 2, seconde: 2, troisième: 3, quatrième: 4,
       cinquième: 5, sixième: 6, septième: 7, huitième: 8, neuvième: 9, dixième: 10}
  it: {primo: 1, prima: 1, secondo: 2, seconda: 2, terzo: 3, terza: 3, quarto: 4, quarta: 4,
       quinto: 5, quinta: 5, sesto: 6, sesta: 6, settimo: 7, settima: 7, ottavo: 8, ottava: 8,
       nono: 9, nona: 9, decimo: 10, decima: 10}
