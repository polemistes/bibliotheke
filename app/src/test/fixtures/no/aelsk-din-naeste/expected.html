<p><span data-num="22" data-page-title="Side:Bjørnson - Samlede værker mindeutgave vol 1.djvu/24" class="wsr-page"></span></p>
<div class="wsr-verse"><div class="wsr-stanza"><span data-n="1" class="wsr-line">Ælsk din næste, du kristensjæl,</span>
<span data-n="2" class="wsr-line">træd ham ikke med jærnskodd hæl,</span>
<span data-n="3" class="wsr-line">ligger han æn i støvet!</span>
<span data-n="4" class="wsr-line">Alt som lever, er underlagt</span>
<span data-n="5" class="wsr-line">kjærlighedens gjenskaper-magt,</span>
<span data-n="6" class="wsr-line">bliver den bare prøvet.</span></div></div>
