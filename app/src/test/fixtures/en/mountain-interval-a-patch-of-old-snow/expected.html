<div class="wsr-verse"><div class="wsr-stanza"><span data-n="1" class="wsr-line">THERE’S a patch of old snow in a corner</span>
<span data-n="2" class="wsr-line">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;That I should have guessed</span>
<span data-n="3" class="wsr-line">Was a blow-away paper the rain</span>
<span data-n="4" class="wsr-line">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Had brought to rest.</span></div>
<div class="wsr-stanza"><span data-n="5" class="wsr-line">It is speckled with grime as if</span>
<span data-n="6" class="wsr-line">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Small print overspread it,</span>
<span data-n="7" class="wsr-line">The news of a day I’ve forgotten—</span>
<span data-n="8" class="wsr-line">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;If I ever read it.</span></div></div>
