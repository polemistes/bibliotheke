(eftir <a rel="mw:WikiLink/Interwiki" href="https://is.wikipedia.org/wiki/Friedrich%20Schiller" title="w:Friedrich Schiller" class="extiw" id="mwBQ">Friedrich Schiller</a>)<br id="mwBg"/>
<br id="mwBw"/>
Fagra gleði, guða logi,<br id="mwCA"/>
Gimlis dóttir, heill sé þér!<br id="mwCQ"/>
Í þinn hásal hrifnir eldi,<br id="mwCg"/>
heilög gyðja, komum vér.<br id="mwCw"/>
Þínir blíðu töfrar tengja<br id="mwDA"/>
tískan meðan sundur slær;<br id="mwDQ"/>
allir bræður aftur verða<br id="mwDg"/>
yndis-vængjum þínum nær.</p></div>
