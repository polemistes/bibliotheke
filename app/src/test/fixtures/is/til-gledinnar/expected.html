<div class="wsr-verse"><div class="wsr-stanza"><span data-n="1" class="wsr-line">Til gleðinnar</span>
<span data-n="2" class="wsr-line">(eftir <a href="https://is.wikipedia.org/wiki/Friedrich%20Schiller">Friedrich Schiller</a>)</span></div>
<div class="wsr-stanza"><span data-n="3" class="wsr-line">Fagra gleði, guða logi,</span>
<span data-n="4" class="wsr-line">Gimlis dóttir, heill sé þér!</span>
<span data-n="5" class="wsr-line">Í þinn hásal hrifnir eldi,</span>
<span data-n="6" class="wsr-line">heilög gyðja, komum vér.</span>
<span data-n="7" class="wsr-line">Þínir blíðu töfrar tengja</span>
<span data-n="8" class="wsr-line">tískan meðan sundur slær;</span>
<span data-n="9" class="wsr-line">allir bræður aftur verða</span>
<span data-n="10" class="wsr-line">yndis-vængjum þínum nær.</span></div></div>
